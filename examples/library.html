<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hopf-hough · library example</title>
<style>
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: #0d131f; color: #e2e8f0; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  pre { background: #070a12; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  canvas { width: 100%; max-width: 512px; image-rendering: pixelated; border: 1px solid #1e293b; border-radius: 8px; }
  code { color: #7dd3fc; }
</style>
</head>
<body>
<h1>Using hopf-hough as a library</h1>
<p>This page computes the field of a charge on a figure-eight path on a 256 × 256 grid with the GPU,
checks a few points against the double-precision reference, and offers the numbers as CSV.</p>
<canvas id="view" width="256" height="256"></canvas>
<pre id="log">running…</pre>
<pre><code id="src"></code></pre>
<script>
  // Load the library bundle (works from the repository and from the GitHub Pages site).
  function load(src) { return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
  load('../hopf-hough.iife.js').catch(() => load('../dist/hopf-hough.iife.js')).then(main);

  function main() {
    const H = window.HopfHough;
    const log = (t) => (document.getElementById('log').textContent = t);

    // 1. Describe the motion. Any x(t), y(t) works; it must stay below c.
    const c = 2.35;
    const traj = H.expressionTrajectory({ x: '0.7*sin(1.9*t)', y: '0.35*sin(3.8*t)', c });

    // 2. Build the history and advance it to the time of interest.
    const cfg = { ...H.DEFAULT_CONFIG, c, mT: 512, kBin: 11, softEps: 0 };
    const sim = new H.Simulation(cfg, [traj], 3.0);

    // 3. Evaluate on the GPU at arbitrary points (here a grid over [-1.5, 1.5]^2).
    const solver = new H.GpuSolver(document.createElement('canvas'));
    solver.upload(sim.shellHistories, cfg.mT);
    const N = 256, pts = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) pts.push({ x: -1.5 + 3 * (i + 0.5) / N, y: 1.5 - 3 * (j + 0.5) / N });
    const t0 = performance.now();
    const field = solver.readFull(pts, cfg);           // [{ ex, ey, bz, quality }, ...]
    const ms = performance.now() - t0;

    // 4. Check a handful of points against the independent float64 reference.
    let worst = 0;
    for (let k = 0; k < 50; k++) {
      const i = (k * 1311) % pts.length, p = pts[i];
      const ref = H.exactField(sim.trajectories, Math.fround(p.x), Math.fround(p.y), sim.time, { c, softEps: 0 });
      if (field[i].quality >= 0 && field[i].quality <= 1.5) worst = Math.max(worst, Math.hypot(field[i].ex - ref.ex, field[i].ey - ref.ey) / ref.mag);
    }

    // Draw log|E| and offer CSV.
    const ctx = document.getElementById('view').getContext('2d'), img = ctx.createImageData(N, N);
    field.forEach((f, i) => { const v = Math.min(255, Math.max(0, 40 * Math.log10(1 + Math.hypot(f.ex, f.ey) * 50))); img.data.set([v * 0.5, v * 0.8, v, 255], i * 4); });
    ctx.putImageData(img, 0, 0);
    const csv = 'x,y,Ex,Ey,Bz,quality\n' + pts.map((p, i) => `${p.x},${p.y},${field[i].ex},${field[i].ey},${field[i].bz},${field[i].quality}`).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv])); a.download = 'field.csv'; a.textContent = 'Download field.csv';
    log(`${pts.length} points in ${ms.toFixed(0)} ms · worst relative error vs float64 reference on 50 resolved samples: ${(worst * 100).toPrecision(3)}%`);
    document.getElementById('log').after(a);
  }
  document.getElementById('src').textContent = document.scripts[document.scripts.length - 1].textContent.trim();
</script>
</body>
</html>
